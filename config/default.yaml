# Single source of truth for the whole pipeline. See architecture.md section 13.
# Every artifact path embeds a hash of the config subset that produced it, so two
# ablation arms cannot overwrite each other and a stale cache cannot poison a result.

seed: 42

paths:
  raw: data/raw
  processed: data/processed
  artifacts: artifacts

dataset:
  variant: HI-Small
  # Asserted at ingest. A mismatch means the wrong dataset variant was downloaded.
  expected_rows: 5078345
  expected_illicit: 5177
  expected_nodes: 515088
  # Patterns.txt annotates only a subset of illicit rows (architecture.md section 2.1).
  expected_pattern_rows: 3209
  expected_attempts: 370
  origin_date: "2022-09-01"

time:
  snapshot_granularity: daily
  # null = cumulative history. The modelling window is 10 days, so a 30d lookback is
  # meaningless here; experiment E7 sweeps {3, 7, null}.
  lookback_days: null

  # MEASURED AT INGEST, days 10-17 hold 1,108 rows (0.02% of the file) at a 58% illicit
  # rate, against 0.09% on days 0-9. That is a generator artifact: the simulator flushes
  # remaining laundering patterns without the background licit traffic. Scoring on it
  # would produce a meaningless AUPRC, so modelling is truncated here.
  max_day: 9

  # 3,248,921 / 482,751 / 1,345,565 rows and 2,530 / 497 / 1,495 illicit.
  train_days: [0, 5]
  val_days: [6, 6]
  test_days: [7, 9]

  # 305 of 370 laundering attempts span more than one day, up to 8 days inside a 10-day
  # window, so essentially every boundary is straddled. Assigning whole attempts to the
  # earlier split (the original plan) would leave test with 59 annotated rows and destroy
  # the per-typology exhibit. Instead we purge: the boundary stays on the transaction
  # timestamp, and train-side rows of any attempt reaching into val/test are dropped.
  # Costs 535 training positives (79% retained); test keeps 913 annotated rows.
  purge_straddling_attempts: true

graph:
  backend: igraph          # igraph | networkx
  exclude_self_loops: true
  pagerank_damping: 0.85
  pagerank_weighted: true

features:
  enabled_groups: [tabular, streaming, structural, motif]
  streaming:
    max_tracked_counterparties: 512   # cap on exact distinct-counterparty sets
  motifs:
    max_depth: 4
    window_hours: 72
    max_branch: 200
  community_prior:
    enabled: true
    alpha: 10.0            # additive smoothing toward the global prior

sampling:
  negative_ratio: 50       # train split only; val/test are never sub-sampled
  account_fraction: 1.0    # wall-clock escape hatch (architecture.md section 13.2)

models:
  recall_target: 0.90
  stack_cv: temporal
  lightgbm:
    n_estimators: 500
    learning_rate: 0.05
    num_leaves: 63
    min_child_samples: 50
    deterministic: true
    force_row_wise: true
  random_forest:
    n_estimators: 300
    min_samples_leaf: 5
  decision_tree:
    # Depth-capped on purpose: rung 1 is the interpretable floor that establishes the
    # problem is hard. An unbounded tree would memorise the sampled training set and
    # report a floor that is not one.
    max_depth: 8
    min_samples_leaf: 50
  logistic_regression:
    C: 1.0
    max_iter: 1000

evaluate:
  bootstrap_iterations: 200
  # 5 blocks x 2 days over the 10-day window: train B1 -> predict B2 -> retrain -> ...
  # gives 4 evaluation points. The original 6x3d assumed an 18-day span.
  walkforward_blocks: 5
  walkforward_block_days: 2
